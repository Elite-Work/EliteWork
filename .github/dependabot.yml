# Dependabot configuration — grouped update PRs by risk.
# Complements the blocking audit gate in .github/workflows/security-audit.yml (issue #204).
#
# Family groups (issue #116): packages that are released in lockstep are grouped
# across *all* update types, majors included, so e.g. every @opentelemetry/*
# bump lands in one PR instead of a dozen. Dependabot assigns each update to the
# first group it matches, so family groups are listed before the catch-all
# low-risk groups. Security updates are unaffected (family groups only apply to
# version updates).
version: 2
updates:
  # ---- Backend (npm) ----
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend
    groups:
      backend-opentelemetry:
        applies-to: version-updates
        patterns:
          - "@opentelemetry/*"
      backend-prisma:
        applies-to: version-updates
        patterns:
          - "prisma"
          - "@prisma/*"
      backend-stryker:
        applies-to: version-updates
        patterns:
          - "@stryker-mutator/*"
      backend-lint:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
      backend-test:
        applies-to: version-updates
        patterns:
          - "jest"
          - "ts-jest"
          - "@types/jest"
          - "supertest"
          - "@types/supertest"
      backend-pino:
        applies-to: version-updates
        patterns:
          - "pino"
          - "pino-*"
      backend-types:
        applies-to: version-updates
        patterns:
          - "@types/*"
      backend-low-risk:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---- Frontend (npm) ----
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    groups:
      frontend-react-next:
        applies-to: version-updates
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      frontend-tailwind:
        applies-to: version-updates
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      frontend-test:
        applies-to: version-updates
        patterns:
          - "jest"
          - "jest-*"
          - "@types/jest"
          - "@types/jest-axe"
          - "@testing-library/*"
          - "@playwright/test"
      frontend-types:
        applies-to: version-updates
        patterns:
          - "@types/*"
      frontend-low-risk:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---- Repo root tooling (npm) ----
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    groups:
      root-low-risk:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ---- Contracts (cargo) ----
  - package-ecosystem: cargo
    directory: /contracts
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - contracts
    groups:
      contracts-soroban:
        applies-to: version-updates
        patterns:
          - "soroban-*"
      contracts-low-risk:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      contracts-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    groups:
      actions-all:
        patterns:
          - "*"
