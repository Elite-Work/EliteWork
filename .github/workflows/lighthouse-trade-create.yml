name: Lighthouse — Trade Creation

# Lighthouse CI (performance + accessibility) for /trades/create, the
# highest-traffic authenticated page. Thresholds and baseline numbers live in
# frontend/lighthouserc.trades-create.json and docs/lighthouse-trade-create.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/lighthouse-trade-create.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/lighthouse-trade-create.yml"

concurrency:
  group: lighthouse-trade-create-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse /trades/create
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.trades-create.json

      - name: Write scores to job summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const dir = ".lighthouseci/trades-create";
            if (!fs.existsSync(dir + "/manifest.json")) { console.log("No Lighthouse results found."); process.exit(0); }
            const runs = JSON.parse(fs.readFileSync(dir + "/manifest.json", "utf8"));
            const rep = runs.find((r) => r.isRepresentativeRun) || runs[0];
            const lhr = JSON.parse(fs.readFileSync(rep.jsonPath, "utf8"));
            const pct = (s) => Math.round(s * 100);
            const a = lhr.audits;
            const rows = [
              ["Performance score", pct(lhr.categories.performance.score), ">= 80"],
              ["Accessibility score", pct(lhr.categories.accessibility.score), ">= 95"],
              ["LCP (ms)", Math.round(a["largest-contentful-paint"].numericValue), "<= 2500"],
              ["TBT (ms)", Math.round(a["total-blocking-time"].numericValue), "<= 400 (warn)"],
              ["CLS", a["cumulative-layout-shift"].numericValue.toFixed(3), "<= 0.02"],
              ["FCP (ms)", Math.round(a["first-contentful-paint"].numericValue), "<= 1800 (warn)"],
            ];
            const md = ["### Lighthouse — /trades/create (median of " + runs.length + " runs)", "", "| Metric | Value | Budget |", "|---|---|---|", ...rows.map((r) => "| " + r.join(" | ") + " |")].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
            console.log(md);
          '

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-trades-create
          path: frontend/.lighthouseci/
          retention-days: 14
