name: Staging Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/staging.yml'
      - 'scripts/staging-up.sh'
      - 'scripts/staging-validate.sh'
      - 'scripts/staging-admin-smoke-test.sh'
      - 'scripts/grafana-deploy-annotation.sh'
      - 'scripts/migrate-*.sh'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.env.staging.example'
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/staging.yml'
      - 'scripts/staging-up.sh'
      - 'scripts/staging-validate.sh'
      - 'scripts/staging-admin-smoke-test.sh'
      - 'scripts/grafana-deploy-annotation.sh'
      - 'scripts/migrate-*.sh'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.env.staging.example'

concurrency:
  group: staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-deploy:
    name: Deploy & Validate Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create .env.staging
        run: |
          cp .env.staging.example .env.staging
          cat >> .env.staging <<'EOF'
          STAGING_POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD || 'staging-password' }}
          STAGING_REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD || 'staging-redis-pass' }}
          STAGING_DATABASE_URL=${{ secrets.STAGING_DATABASE_URL || 'postgresql://postgres:staging-password@localhost:5434/amana_staging' }}
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET || 'ci-staging-jwt-secret-placeholder-minimum-32' }}
          EOF

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Start staging stack
        run: |
          chmod +x ./scripts/staging-up.sh ./scripts/staging-validate.sh ./scripts/staging-admin-smoke-test.sh
          ./scripts/staging-up.sh
        timeout-minutes: 10

      - name: Start backend service
        working-directory: backend
        run: |
          set -a
          source ../.env.staging
          set +a
          export DATABASE_URL="${STAGING_DATABASE_URL:-postgresql://postgres:staging-password@localhost:5434/amana_staging}"
          export REDIS_URL="${STAGING_REDIS_URL:-redis://localhost:6380}"
          export JWT_SECRET="${JWT_SECRET:-ci-staging-jwt-secret-placeholder-minimum-32}"
          export AMANA_ESCROW_CONTRACT_ID="${AMANA_ESCROW_CONTRACT_ID:-CCY3G5O6M7K8N9P0Q1R2S3T4U5V6W7X8Y9Z0A1B2C3}"
          export USDC_CONTRACT_ID="${USDC_CONTRACT_ID:-test-usdc-contract}"
          export ADMIN_SECRET_KEY="${ADMIN_SECRET_KEY:-test-admin-secret-key-value}"
          nohup npm run dev > /tmp/amana-backend.log 2>&1 &
          echo $! > /tmp/amana-backend.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health/live >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/amana-backend.log
          exit 1

      - name: Validate staging deployment
        run: ./scripts/staging-validate.sh
        timeout-minutes: 5

      - name: Run Staging Admin Smoke Test
        run: ./scripts/staging-admin-smoke-test.sh
        timeout-minutes: 5

      - name: Annotate Grafana golden-signals dashboard with this deploy
        if: success()
        continue-on-error: true
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
          DEPLOY_ENV: staging
          DEPLOY_REF: ${{ github.sha }}
        run: |
          chmod +x ./scripts/grafana-deploy-annotation.sh
          ./scripts/grafana-deploy-annotation.sh

      - name: Notify on Staging Validation or Smoke Test Failure
        if: failure()
        run: |
          echo "::error title=Staging Deployment Failure::Staging validation or admin route smoke test failed."
          echo "### 🚨 Staging Deployment Failure Notification" >> $GITHUB_STEP_SUMMARY
          echo "The staging deployment or admin route smoke test failed during automated validation." >> $GITHUB_STEP_SUMMARY
          echo "Please review workflow logs and ensure admin endpoints and staging services are functioning correctly." >> $GITHUB_STEP_SUMMARY

      - name: Tear down staging stack
        if: always()
        run: docker compose --profile staging down -v --remove-orphans
